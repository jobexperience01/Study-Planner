<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#14213d;--mute:#667089;--line:#e1e5ef;--acc:#3b5bff;--acc-ink:#fff;--l3:#e5484d;--l2:#d98a00;--l1:#3b5bff;--l0:#2f9467;--chip:#eaeefc;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#171f35;--ink:#eef1fb;--mute:#9aa4c2;--line:#27314d;--acc:#7c93ff;--acc-ink:#0e1424;--l3:#ff6b70;--l2:#f5b13d;--l1:#7c93ff;--l0:#4cc58f;--chip:#212b4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#171f35;--ink:#eef1fb;--mute:#9aa4c2;--line:#27314d;--acc:#7c93ff;--acc-ink:#0e1424;--l3:#ff6b70;--l2:#f5b13d;--l1:#7c93ff;--l0:#4cc58f;--chip:#212b4a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:18px 14px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.9rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 8px}
.date{color:var(--mute);margin:2px 0 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px}
.hero{margin:16px 0;background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.hero b{display:block;font-size:2.2rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hero span{font-size:.8rem;opacity:.8}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:600;cursor:pointer}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:600}
.btn.alt{background:var(--chip);color:var(--ink)}
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:600;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{color:var(--mute);font-size:.88rem;margin:0 0 10px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--chip);border-radius:16px;padding:10px;min-height:180px;transition:outline .1s}
.col.over{outline:2px dashed var(--acc)}
.col h2{display:flex;justify-content:space-between;padding:2px 4px}
.cnt{background:var(--surface);border-radius:99px;padding:0 9px;font-size:.85rem}
.card,.row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px}
.card{cursor:grab}.card.drag{opacity:.4}
.l0{--c:var(--l0)}.l1{--c:var(--l1)}.l2{--c:var(--l2)}.l3{--c:var(--l3)}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0;font-size:.75rem;color:var(--mute)}
.tag{background:var(--chip);padding:1px 8px;border-radius:99px;color:var(--ink)}
.tag.up{background:var(--l3);color:#fff}
.late{color:var(--l3);font-weight:600}
.acts{display:flex;gap:6px;align-items:center}
.acts button{background:var(--chip);border:0;border-radius:8px;min-width:36px;height:34px}
.acts .sp{flex:1}
.empty{text-align:center;color:var(--mute);padding:20px 8px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--c,var(--acc));transition:width .4s}
.srow{display:flex;justify-content:space-between;font-size:.88rem}
.row{display:flex;align-items:center;gap:10px}
.row .name{flex:1}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--mute);background:transparent;color:var(--acc-ink);font-weight:800}
.chk[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
.time{font-size:4rem;font-weight:800;text-align:center;letter-spacing:-.03em;margin:6px 0}
.center{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}.ov[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.yn{display:flex;gap:6px}.yn button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:56px;height:38px;font-weight:600}
.yn .y.on{background:var(--l0);color:#fff;border-color:var(--l0)}.yn .n.on{background:var(--l3);color:#fff;border-color:var(--l3)}
[data-go]{cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px}.chart button{flex:1;height:100%;border:0;background:var(--chip);border-radius:6px 6px 0 0;padding:0;min-width:0;display:flex;align-items:flex-end}.chart button i{display:block;width:100%;background:var(--l0);border-radius:6px 6px 0 0}
.lbl{display:flex;gap:4px;font-size:.65rem;color:var(--mute);text-align:center}.lbl span{flex:1}
.run{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0}
.rb{height:12px;background:var(--chip);border-radius:99px;overflow:hidden}.rb i{display:block;height:100%;background:var(--c)}
.dn{display:flex;align-items:center;gap:12px}.donut{width:140px;height:140px;flex:none}.dn>div{flex:1}
.score{font-size:2.6rem;font-weight:800;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bdg{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--mute)}.bdg.on{background:var(--l0);color:#fff;border-color:var(--l0)}
@keyframes fl{0%,60%{outline:3px solid var(--acc)}100%{outline:3px solid transparent}}.flash{animation:fl 1.8s}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:20px}}
@media (max-width:760px){
.board{grid-auto-flow:column;grid-auto-columns:84%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.col{scroll-snap-align:center}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<div><h1>Study Planner</h1><p class="date" id="date"></p></div>
<div style="display:flex;gap:8px;align-items:center"><button class="tag" id="st" style="border:0;cursor:pointer;font:inherit;font-size:.8rem;padding:6px 10px;color:var(--ink)" aria-label="Open team tab">Solo</button><button class="tag" id="auth" style="border:0;cursor:pointer;font:inherit;font-size:.8rem;padding:6px 10px;color:var(--ink)">Sign in</button><button class="icon" id="theme" aria-label="Toggle theme">◐</button></div>
</header>
<p class="hint" id="noacc" hidden style="color:var(--l3);font-weight:600;margin:10px 0 0"></p>

<section class="hero" aria-live="polite">
<div><b id="hPct">0%</b><span>Tasks finished</span></div>
<div><b id="hStreak">0</b><span>Day streak</span></div>
<div><b id="hFocus">0</b><span>Focus min today</span></div>
</section>

<details id="addBox"><summary>Add a task</summary>
<form id="f">
<label class="full">Task name<input id="name" required maxlength="80" placeholder="e.g. Organic chemistry – chapter 4"></label>
<label>Deadline<input id="dl" type="date"></label>
<label>Starting priority<select id="pr"><option value="0">High</option><option value="1" selected>Medium</option><option value="2">Low</option></select></label>
<label>Type<select id="ty"><option value="task">One-time task (board)</option><option value="daily">Daily habit (asked every day)</option><option value="weekly">Weekly habit</option></select></label><label>Times per week<input id="tg" type="number" min="1" max="7" value="3"></label>
<button class="btn full" type="submit">Add task</button>
</form></details>

<details id="dataBox" style="margin-top:10px"><summary>Backup: export / import data</summary>
<p class="hint" style="margin-top:10px">Export saves everything (tasks, habits, check-ins, streak and focus minutes) to a .json file. Send that file to someone, and they can import it to get the same data.</p>
<div class="center"><button class="btn" id="exp" type="button">Export data (.json)</button><button class="btn alt" id="imp" type="button">Import data…</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
<p class="hint" id="dmsg" role="status" style="margin:10px 0 0"></p>
</details>

<div class="tabs" role="tablist">
<button role="tab" data-t="board">Board</button>
<button role="tab" data-t="today">Today</button><button role="tab" data-t="graphs">Graphs</button><button role="tab" data-t="team">Team</button>
<button role="tab" data-t="timer">Timer</button>
</div>
<div id="view"></div>
</main>
<div class="ov" id="ck" hidden role="dialog" aria-modal="true" aria-label="Daily check-in"><div class="sheet" id="ckb"></div></div>
<div class="ov" id="cm" hidden role="dialog" aria-modal="true" aria-label="Comments"><div class="sheet" id="cmb"></div></div>

window.claude={use:function(n){

<script>
(function(){
var KEY="study-planner-v2",tab="board",S={tasks:[],act:{},focus:{}};
var T={mode:"f",left:1500,id:null};
var LV=["Low","Medium","High","Urgent"],INT=[1,3,7,14,30];
var COLS=[["todo","To do"],["doing","In progress"],["done","Done"]];
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return fmt(new Date())}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmt(d)}
function diff(s){return Math.round((new Date(s+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);S.tasks=S.tasks||[];S.act=S.act||{};S.focus=S.focus||{};return}
 var o=JSON.parse(localStorage.getItem("study-planner-v1"));
 if(o)S.tasks=o.map(function(t){return{id:t.id,n:t.n,dl:t.dl,p:t.p,ty:t.ty==="daily"?"daily":"task",st:t.done?"done":"todo",doneOn:t.doneOn,nextRev:t.done?addDays(today(),1):null,step:0,log:t.log||{}}})}catch(e){}}
function save(){if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}push()}
function mark(){S.act[today()]=1}

/* smart priority: starting priority + deadline pressure */
function lvl(t){
 var base=3-t.p,u=0;
 if(t.dl&&t.st!=="done"){var n=diff(t.dl);u=n<0?4:n<=1?3:n<=3?2:n<=7?1:0}
 var s=base+u,i=s>=5?3:s>=3?2:s===2?1:0,b=t.p===0?2:t.p===1?1:0;
 return{s:s,i:i,up:i>b,from:LV[b]};
}
function sortT(a,b){return lvl(b).s-lvl(a).s||(a.dl||"9999").localeCompare(b.dl||"9999")}
function left(dl){if(!dl)return"";var n=diff(dl);return n<0?'<span class="late">Overdue '+(-n)+"d</span>":n===0?'<span class="late">Due today</span>':n===1?'<span class="late">Due tomorrow</span>':"<span>"+n+" days left</span>"}
function move(t,st){
 if(!t||t.st===st)return;
 t.st=st;
 if(st==="done"){t.doneOn=today();t.doneBy=ME;t.step=0;t.nextRev=addDays(today(),INT[0]);mark()}else{t.nextRev=null}
 save();render();
}
function find(id){return S.tasks.filter(function(x){return x.id===+id})[0]}
function streak(){var d=today(),n=0;if(!S.act[d])d=addDays(d,-1);while(S.act[d]){n++;d=addDays(d,-1)}return n}

function card(t){
 var L=lvl(t),i=COLS.map(function(c){return c[0]}).indexOf(t.st),rev="",rw=!ro(),cmb=live?'<button data-a="cm" data-id="'+t.id+'" aria-label="Comments">💬 '+cmCount(t.id)+"</button>":"";
 if(t.st==="done"){rev=t.nextRev?(diff(t.nextRev)<=0?'<span class="late">Revise today</span>':"<span>Revise in "+diff(t.nextRev)+"d</span>"):"<span>Mastered ✓</span>"}
 return '<div class="card l'+L.i+'" draggable="'+rw+'" data-id="'+t.id+'"><div class="name">'+esc(t.n)+'</div><div class="meta"><span class="tag">'+LV[L.i]+"</span>"+(L.up?'<span class="tag up">↑ from '+L.from+"</span>":"")+(t.st==="done"?rev:left(t.dl))+(t.by&&t.by!==ME&&NM[t.by]?"<span>by "+esc(NM[t.by])+"</span>":"")+'</div><div class="acts">'+(rw?'<button data-a="m" data-d="-1" data-id="'+t.id+'" aria-label="Move left"'+(i===0?" disabled":"")+'>‹</button><button data-a="m" data-d="1" data-id="'+t.id+'" aria-label="Move right"'+(i===2?" disabled":"")+'>›</button>':"")+'<span class="sp"></span>'+cmb+(rw?'<button data-a="del" data-id="'+t.id+'" aria-label="Delete task">×</button>':"")+'</div></div>';
}
function vBoard(){names(S.tasks.map(function(t){return t.by}));
 var tk=S.tasks.filter(function(t){return t.ty==="task"});
 return '<p class="hint">Drag cards between columns, or use ‹ › on a phone. Priority rises on its own as deadlines get close.</p><div class="board">'+COLS.map(function(c){
  var items=tk.filter(function(t){return t.st===c[0]}).sort(sortT);
  return '<div class="col" data-col="'+c[0]+'"><h2>'+c[1]+'<span class="cnt">'+items.length+"</span></h2>"+(items.length?items.map(card).join(""):'<div class="empty">'+(c[0]==="todo"?"Add a task to get started.":"Drop a card here.")+"</div>")+"</div>";
 }).join("")+"</div>";
}
function vToday(){
 var d=today(),tk=S.tasks.filter(function(t){return t.ty==="task"}),dl=habs().filter(function(t){return ap(t,today())});
 var tot=tk.length||1,cnt={};COLS.forEach(function(c){cnt[c[0]]=tk.filter(function(t){return t.st===c[0]}).length});
 var colr={todo:"var(--l2)",doing:"var(--l1)",done:"var(--l0)"};
 var prog='<div class="panel"><h2>Progress by stage</h2>'+COLS.map(function(c){return '<div class="srow"><span>'+c[1]+"</span><span>"+cnt[c[0]]+" of "+tk.length+'</span></div><div class="bar" style="--c:'+colr[c[0]]+'"><i style="width:'+Math.round(cnt[c[0]]/tot*100)+'%"></i></div>'}).join("")+"</div>";
 var top=tk.filter(function(t){return t.st!=="done"}).sort(sortT).slice(0,3);
 var focus='<div class="panel"><h2>Do these next</h2>'+(top.length?top.map(function(t){var L=lvl(t);return '<div class="row l'+L.i+'"><div class="name">'+esc(t.n)+'<div class="meta"><span class="tag">'+LV[L.i]+"</span>"+left(t.dl)+'</div></div><button class="btn alt" data-a="go" data-id="'+t.id+'">'+(t.st==="todo"?"Start":"Finish")+"</button></div>"}).join(""):'<div class="empty">Nothing pending. Add a task above.</div>')+"</div>";
 var due=tk.filter(function(t){return t.st==="done"&&t.nextRev&&diff(t.nextRev)<=0});
 var rev='<div class="panel"><h2>Revise today ('+due.length+')</h2>'+(due.length?due.map(function(t){return '<div class="row l0"><div class="name">'+esc(t.n)+'<div class="meta"><span>Round '+(t.step+1)+" of "+INT.length+'</span></div></div><button class="btn" data-a="rev" data-id="'+t.id+'">Revised</button></div>'}).join(""):'<div class="empty">No revisions due. Finished tasks come back after 1, 3, 7, 14 and 30 days.</div>')+"</div>";
 var hab='<div class="panel"><h2>Daily habits <button class="btn alt" data-go="check" data-date="'+d+'" style="min-height:32px;float:right">Check-in</button></h2>'+(dl.length?dl.map(function(t){var on=!!(t.log&&t.log[d]);return '<div class="row l'+lvl(t).i+'"><button class="chk" aria-pressed="'+on+'" aria-label="Mark done today" data-a="hab" data-id="'+t.id+'">'+(on?"✓":"")+'</button><div class="name">'+esc(t.n)+(t.fq==="w"?'<div class="meta"><span>'+wc(t,wk(d))+" of "+t.tg+" this week</span></div>":"")+'</div><button class="acts" style="background:none;border:0;font-size:1.2rem;color:var(--mute)" data-a="del" data-id="'+t.id+'" aria-label="Delete habit">×</button></div>'}).join(""):'<div class="empty">No habits yet. Add one with type “Daily habit”.</div>')+"</div>";
 return '<div class="grid2"><div>'+prog+focus+'</div><div>'+rev+hab+"</div></div>";
}
function vTimer(){
 return '<div class="panel"><h2>'+(T.mode==="f"?"Focus session":"Break")+'</h2><div class="time" id="tm"></div><div class="center"><button class="btn" id="tgo">'+(T.id?"Pause":"Start")+'</button><button class="btn alt" id="trs">Reset</button><button class="btn alt" id="tmd">Switch to '+(T.mode==="f"?"5 min break":"25 min focus")+'</button></div><p class="hint" style="text-align:center;margin-top:12px">25 minutes of focus, then a 5 minute break. Each finished session adds to today’s focus minutes and keeps your streak.</p></div>';
}

 if(!/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(em)){alert("Enter a valid email address.");return}
 accSet(em,$("accr").value);$("acce").value="";$("acce").blur();
});
V.addEventListener("change",function(e){var k=e.target.dataset&&e.target.dataset.acc;if(!k)return;accSet(k,e.target.value);e.target.blur()});
V.addEventListener("click",function(e){var b=e.target.closest("button[data-accdel]");if(!b||ROLE!=="owner"||!DB)return;var k=b.dataset.accdel;if(confirm("Remove "+k+"? They will lose access."))DB.doc("access/"+k).delete().catch(function(){alert("Could not remove.")})});

/* comments on cards */
function cmCount(id){return CMT.filter(function(c){return c.tid===id}).length}
function cmOpen(id){cmT=id;cmDraw();$("cm").hidden=false}
function cmDraw(){
 var t=find(cmT);if(!t){$("cm").hidden=true;return}
 var list=CMT.filter(function(c){return c.tid===cmT}).sort(function(a,b){return a.ts-b.ts});
 $("cmb").innerHTML='<h2>'+esc(t.n)+'</h2><p class="hint">Comments</p>'+(list.length?list.map(function(c){return '<div class="row l1"><div class="name"><div class="meta"><b>'+esc(c.name||"Student")+'</b><span>'+new Date(c.ts).toLocaleString()+'</span></div>'+esc(c.text)+'</div>'+((c.by===ME||canW)?'<button style="background:none;border:0;font-size:1.2rem;color:var(--mute)" data-cdel="'+esc(c.id)+'" aria-label="Delete comment">×</button>':"")+'</div>'}).join(""):'<div class="empty">No comments yet.</div>')+(canC?'<form id="cmf" style="grid-template-columns:1fr auto"><input id="cmi" maxlength="300" placeholder="Write a comment" aria-label="Write a comment"><button class="btn" type="submit">Post</button></form>':'<p class="hint">Viewers can read comments but not post.</p>')+'<button class="btn" id="cmx" style="width:100%;margin-top:12px">Close</button>';
}
var CM=$("cm");
CM.addEventListener("click",function(e){
 if(e.target===CM||e.target.id==="cmx"){CM.hidden=true;render(true);return}
 var b=e.target.closest("button[data-cdel]");if(b&&DB)DB.doc("comments/"+b.dataset.cdel).delete().catch(fail);
});
CM.addEventListener("submit",function(e){
 e.preventDefault();var i=$("cmi"),x=i?i.value.trim():"";if(!x||!DB||!canC||!cmT)return;
 DB.doc("comments/"+Date.now()+"-"+ME.slice(0,6)).set({tid:cmT,by:ME,name:MEN,text:x,ts:Date.now()}).catch(function(){alert("Could not post the comment.")});i.value="";
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!CM.hidden){CM.hidden=true;render(true)}});

/* export / import all app data as a JSON file */
function dmsg(t){$("dmsg").textContent=t}
$("exp").onclick=function(){
 var data={app:"study-planner",version:2,exported:new Date().toISOString(),tasks:S.tasks,act:S.act,focus:S.focus};
 var a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
 a.href=u;a.download="study-planner-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(u)},1000);
 dmsg("Exported "+S.tasks.length+" items.");
};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){
 var f=this.files[0];this.value="";if(!f)return;
 var r=new FileReader();
 r.onerror=function(){dmsg("Could not read that file.")};
 r.onload=function(){
  var d;try{d=JSON.parse(r.result)}catch(e){dmsg("That file is not valid JSON.");return}
  if(!d||d.app!=="study-planner"||!Array.isArray(d.tasks)){dmsg("That file is not a Study Planner backup.");return}
  if(ro()){dmsg("Your role cannot change the shared board, so import is turned off.");return}
  var tasks=d.tasks.filter(function(t){return t&&typeof t.n==="string"&&isFinite(t.id)}).map(function(t){
   t.id=+t.id;t.log=(t.log&&typeof t.log==="object")?t.log:{};if(t.own)t.own=ME;return t});
  var msg="Replace ALL current data with this file ("+tasks.length+" items)? Anything not in the file will be removed."+(live?" Live sync is on, so this also updates the shared board for everyone.":"");
  if(!confirm(msg))return;
  S.tasks=tasks;S.act=(d.act&&typeof d.act==="object")?d.act:{};S.focus=(d.focus&&typeof d.focus==="object")?d.focus:{};
  save();render();dmsg("Imported "+tasks.length+" items.");
 };
 r.readAsText(f);
};
load();render();start();
})();
</script>
