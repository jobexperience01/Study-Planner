<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#14213d;--mute:#667089;--line:#e1e5ef;--acc:#3b5bff;--acc-ink:#fff;--l3:#e5484d;--l2:#d98a00;--l1:#3b5bff;--l0:#2f9467;--chip:#eaeefc;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#171f35;--ink:#eef1fb;--mute:#9aa4c2;--line:#27314d;--acc:#7c93ff;--acc-ink:#0e1424;--l3:#ff6b70;--l2:#f5b13d;--l1:#7c93ff;--l0:#4cc58f;--chip:#212b4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#171f35;--ink:#eef1fb;--mute:#9aa4c2;--line:#27314d;--acc:#7c93ff;--acc-ink:#0e1424;--l3:#ff6b70;--l2:#f5b13d;--l1:#7c93ff;--l0:#4cc58f;--chip:#212b4a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:18px 14px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.9rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 8px}
.date{color:var(--mute);margin:2px 0 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px}
.hero{margin:16px 0;background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.hero b{display:block;font-size:2.2rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hero span{font-size:.8rem;opacity:.8}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:600;cursor:pointer}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:600}
.btn.alt{background:var(--chip);color:var(--ink)}
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:600;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{color:var(--mute);font-size:.88rem;margin:0 0 10px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--chip);border-radius:16px;padding:10px;min-height:180px;transition:outline .1s}
.col.over{outline:2px dashed var(--acc)}
.col h2{display:flex;justify-content:space-between;padding:2px 4px}
.cnt{background:var(--surface);border-radius:99px;padding:0 9px;font-size:.85rem}
.card,.row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px}
.card{cursor:grab}.card.drag{opacity:.4}
.l0{--c:var(--l0)}.l1{--c:var(--l1)}.l2{--c:var(--l2)}.l3{--c:var(--l3)}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0;font-size:.75rem;color:var(--mute)}
.tag{background:var(--chip);padding:1px 8px;border-radius:99px;color:var(--ink)}
.tag.up{background:var(--l3);color:#fff}
.late{color:var(--l3);font-weight:600}
.acts{display:flex;gap:6px;align-items:center}
.acts button{background:var(--chip);border:0;border-radius:8px;min-width:36px;height:34px}
.acts .sp{flex:1}
.empty{text-align:center;color:var(--mute);padding:20px 8px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--c,var(--acc));transition:width .4s}
.srow{display:flex;justify-content:space-between;font-size:.88rem}
.row{display:flex;align-items:center;gap:10px}
.row .name{flex:1}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--mute);background:transparent;color:var(--acc-ink);font-weight:800}
.chk[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
.time{font-size:4rem;font-weight:800;text-align:center;letter-spacing:-.03em;margin:6px 0}
.center{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}.ov[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.yn{display:flex;gap:6px}.yn button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:56px;height:38px;font-weight:600}
.yn .y.on{background:var(--l0);color:#fff;border-color:var(--l0)}.yn .n.on{background:var(--l3);color:#fff;border-color:var(--l3)}
[data-go]{cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px}.chart button{flex:1;height:100%;border:0;background:var(--chip);border-radius:6px 6px 0 0;padding:0;min-width:0;display:flex;align-items:flex-end}.chart button i{display:block;width:100%;background:var(--l0);border-radius:6px 6px 0 0}
.lbl{display:flex;gap:4px;font-size:.65rem;color:var(--mute);text-align:center}.lbl span{flex:1}
.run{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0}
.rb{height:12px;background:var(--chip);border-radius:99px;overflow:hidden}.rb i{display:block;height:100%;background:var(--c)}
.dn{display:flex;align-items:center;gap:12px}.donut{width:140px;height:140px;flex:none}.dn>div{flex:1}
.score{font-size:2.6rem;font-weight:800;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bdg{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--mute)}.bdg.on{background:var(--l0);color:#fff;border-color:var(--l0)}
@keyframes fl{0%,60%{outline:3px solid var(--acc)}100%{outline:3px solid transparent}}.flash{animation:fl 1.8s}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:20px}}
@media (max-width:760px){
.board{grid-auto-flow:column;grid-auto-columns:84%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.col{scroll-snap-align:center}.grid2{grid-template-columns:1fr}}

/* ---- modern app layout ---- */
:root{--sh:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
main{padding-bottom:130px}
header{align-items:center}
h1{font-size:1.65rem}
.icon{width:44px;height:44px;border-radius:14px}
header .tag{min-height:36px;padding:0 12px!important;display:inline-flex;align-items:center}
.hero{background:linear-gradient(135deg,#2f45d6,#5b3fd1);color:#fff;border-radius:22px;box-shadow:var(--sh)}
.hero span{opacity:.88}
.panel{border-radius:18px;box-shadow:var(--sh)}
.card{border-radius:14px;padding:12px;box-shadow:var(--sh);touch-action:pan-y;transition:transform .15s}
.sheet{border-radius:24px 24px 0 0}
.sheet h2{font-size:1.2rem}
.chk{width:40px;height:40px;font-size:1.1rem}
.tabs{position:sticky;top:8px;z-index:20;backdrop-filter:blur(10px);box-shadow:var(--sh);border-radius:16px}
.tabs button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.tabs svg,.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs button[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:2px;right:calc(50% - 30px);min-width:18px;height:18px;border-radius:9px;background:var(--l3);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 4px}
.stages{display:none;gap:8px;margin:0 0 12px}
.stages button{flex:1;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.stages button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.stages .cnt{background:rgba(127,127,127,.22);color:inherit}
.card .acts{margin-top:8px}
.card .acts button{height:44px;min-width:44px;border-radius:12px;font-weight:600}
.card .acts .btn{flex:1;background:var(--acc);color:var(--acc-ink)}
.card .acts .btn.alt{background:var(--chip);color:var(--ink)}
.stk{display:grid;gap:8px}
.fab{position:fixed;right:20px;bottom:24px;z-index:35;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px;border:0;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:700;box-shadow:0 8px 24px rgba(59,91,255,.4)}
.fab svg{stroke-width:2.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600;box-shadow:var(--sh);max-width:90%;text-align:center}
@media (max-width:760px){
 .board{display:block;overflow:visible;padding-bottom:0}
 .col{display:none;min-height:0}
 .col.cur{display:block}
 .col>h2{display:none}
 .stages{display:flex}
 .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;border-radius:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.1);gap:2px;backdrop-filter:none}
 .tabs button{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 2px;min-height:54px;border-radius:12px}
 .tabs button[aria-selected="true"]{background:var(--chip);box-shadow:none;color:var(--acc)}
 .fab{width:56px;padding:0;justify-content:center;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .fab span{display:none}
 .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}

/* ---- table view ---- */
.seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin:0 0 12px;max-width:280px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.tbar select{width:auto;min-width:150px}
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto;box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:12px;border-bottom:1px solid var(--line);background:var(--chip);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--chip)}
.tbl tbody tr:last-child td{border-bottom:0}
.tn{font-weight:600;overflow-wrap:anywhere}
.tsub{font-size:.76rem;color:var(--mute)}
.pri,.stt{display:inline-block;padding:2px 11px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1.5px solid var(--c);color:var(--ink)}
@media (max-width:760px){.hm{display:none}.tbl th,.tbl td{padding:10px 8px}.tbl{font-size:.88rem}}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchips button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.fchips button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fchips .cnt{background:rgba(127,127,127,.22);color:inherit}
.stt.reg{--c:#7a4fd6}
label[hidden]{display:none}
#teamBar[hidden]{display:none}
/* undo / redo (board toolbar) */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.hrow .seg{margin:0;flex:1}
.hgrp{display:flex;gap:6px}
.hb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hb:disabled{opacity:.35;cursor:default}
#asL[hidden]{display:none}
.tabs button[data-t="alerts"] .tl{white-space:nowrap}
@media (max-width:760px){.tabs button[data-t="alerts"] .tl{font-size:.6rem}}
.al{display:block;width:100%;text-align:left;margin:0 0 8px}
.al.new{border-color:var(--acc);background:var(--chip)}
.nd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--l3);margin-right:7px;vertical-align:middle}
</style>
</head>
<body>
<main>
<header>
<div><h1>Study Planner</h1><p class="date" id="date"></p></div>
<div style="display:flex;gap:8px;align-items:center"><button class="tag" id="st" style="border:0;cursor:pointer;font:inherit;font-size:.8rem;padding:6px 10px;color:var(--ink)" aria-label="Open team tab">Solo</button><button class="tag" id="auth" style="border:0;cursor:pointer;font:inherit;font-size:.8rem;padding:6px 10px;color:var(--ink)">Sign in</button><button class="icon" id="theme" aria-label="Toggle theme">◐</button></div>
</header>
<div class="panel" id="noacc" hidden style="margin:12px 0 0"></div>
<div class="panel" id="reqbar" hidden style="margin:12px 0 0"></div>
<div id="teamBar" hidden style="margin:12px 0 0"></div>

<section class="hero" aria-live="polite">
<div><b id="hPct">0%</b><span>Tasks finished</span></div>
<div><b id="hStreak">0</b><span>Day streak</span></div>
<div><b id="hUnread">0</b><span>Unread notifications</span></div>
</section>

<div class="ov" id="addBox" hidden role="dialog" aria-modal="true" aria-label="Add a task"><div class="sheet"><h2>New task</h2>
<form id="f">
<label class="full">Task name<input id="name" required maxlength="80" placeholder="e.g. Organic chemistry – chapter 4"></label>
<label>Type<select id="ty"><option value="task">One-time task (board)</option><option value="daily">Daily regular task (every day until end date)</option><option value="weekly">Weekly habit</option></select></label>
<label>Starting priority<select id="pr"><option value="0">High</option><option value="1" selected>Medium</option><option value="2">Low</option></select></label>
<label><span id="dlT">Deadline</span><input id="dl" type="date"></label>
<label id="odL">Do it on (optional)<input id="od" type="date"></label>
<label id="tgL" hidden>Times per week<input id="tg" type="number" min="1" max="7" value="3"></label>
<label>Start time (optional)<input id="ts" type="time"></label>
<label>End time (optional)<input id="te" type="time"></label>
<label class="full" id="tmL" hidden>Team<select id="tmSel"></select></label>
<div class="full" id="asL" hidden><span class="hint" style="display:block;margin:0 0 6px">Assign to (optional, pick one or more)</span><div class="fchips" id="asChips" style="margin:0"></div></div>
<label class="full">Alarm (rings at the start time, default alarm sound)<select id="al"></select></label>
<button class="btn alt full" type="button" id="tstA">Test alarm sound</button>
<button class="btn full" type="submit">Add task</button>
<button class="btn alt full" type="button" id="addX">Cancel</button>
</form></div></div>


<nav class="tabs" role="tablist" aria-label="Sections">
<button role="tab" data-t="board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg><span class="tl">Board</span></button>
<button role="tab" data-t="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span class="tl">Today</span></button>
<button role="tab" data-t="graphs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20V9"/></svg><span class="tl">Graphs</span></button>
<button role="tab" data-t="team"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.5c2.5 0 4.5 1.7 4.5 4.5"/></svg><span class="tl">Team</span></button>
<button role="tab" data-t="alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/></svg><span class="tl">Notifications</span></button>
</nav>
<div id="view"></div>
<details id="dataBox" style="margin-top:22px"><summary>Backup: export / import data</summary>
<p class="hint" style="margin-top:22px">Export saves everything (tasks, habits, check-ins and streak) to a .json file. Send that file to someone, and they can import it to get the same data.</p>
<div class="center"><button class="btn" id="exp" type="button">Export data (.json)</button><button class="btn alt" id="imp" type="button">Import data…</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
<p class="hint" id="dmsg" role="status" style="margin:10px 0 0"></p>
</details>

</main>
<button class="fab" id="fab" type="button" aria-label="Add a task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New task</span></button>
<div class="ov" id="ck" hidden role="dialog" aria-modal="true" aria-label="Daily check-in"><div class="sheet" id="ckb"></div></div>
<div class="ov" id="cm" hidden role="dialog" aria-modal="true" aria-label="Comments"><div class="sheet" id="cmb"></div></div>
<div class="ov" id="as" hidden role="dialog" aria-modal="true" aria-label="Task actions"><div class="sheet" id="asb"></div></div>
<div class="ov" id="alm" hidden role="alertdialog" aria-modal="true" aria-label="Task alarm" style="z-index:70"><div class="sheet" id="almb"></div></div>

function wrapTxt(ctx,text,maxW,maxL){
 var out=[],cur="";
 String(text).split(/\s+/).forEach(function(w){
  while(ctx.measureText(w).width>maxW&&w.length>1){var k=w.length;while(k>1&&ctx.measureText(w.slice(0,k)).width>maxW)k--;if(cur){out.push(cur);cur=""}out.push(w.slice(0,k));w=w.slice(k)}
  var t=cur?cur+" "+w:w;
  if(ctx.measureText(t).width<=maxW)cur=t;else{out.push(cur);cur=w}
 });
 if(cur)out.push(cur);
 if(out.length>maxL){out=out.slice(0,maxL);var l=out[maxL-1];while(l.length>1&&ctx.measureText(l+"…").width>maxW)l=l.slice(0,-1);out[maxL-1]=l+"…"}
 return out;
}

function asOpen(id){asT=id;asMode="";asDraw();AS.hidden=false}
function asDraw(){
 var t=find(asT);if(!t){AS.hidden=true;return}
 if(asMode==="time"){timeDraw(t);return}
 if(asMode==="edit"){editDraw(t);return}
 var rw=!ro(),mod=canMod(t),stg=canStage(t);
 $("asb").innerHTML='<h2>'+esc(t.n)+'</h2>'+(live&&rw&&!mod?'<p class="hint">Only the task creator and admins can change the details'+(stg?"":" or move this task")+'. You can still comment.</p>':'')+(mod&&rw?'<button class="btn" data-ac="ed" style="width:100%;margin:2px 0 10px">✏️ Edit task</button>':'')+(stg&&rw?'<p class="hint">Move to</p><div class="stk">'+COLS.map(function(c){var cur=t.st===c[0];return '<button class="btn'+(cur?"":" alt")+'" data-st="'+c[0]+'"'+(cur?' aria-current="true"':"")+'>'+c[1]+(cur?" (current)":"")+'</button>'}).join("")+'</div>':'')+(ROLE==="owner"&&live&&hasTeams()?'<p class="hint" style="margin-top:12px">Move to team</p><div class="stk">'+myTeamIds().concat([""]).map(function(id){var cur=(t.team||"")===id;return'<button class="btn'+(cur?"":" alt")+'" data-mt="'+esc(id)+'">'+esc(teamName(id))+(cur?" (current)":"")+"</button>"}).join("")+"</div>":"")+'<button class="btn alt" data-ac="tm" style="width:100%;margin-top:10px">⏰ Time &amp; alarm</button>'+(live?'<button class="btn alt" data-ac="cm" style="width:100%;margin-top:10px">💬 Comments ('+cmCount(t.id)+')</button>':'')+(mod&&rw?'<button class="btn alt" data-ac="del" style="width:100%;margin-top:10px;color:var(--l3)">Delete task</button>':'')+'<button class="btn alt" data-ac="x" style="width:100%;margin-top:10px">Close</button>';
}
AS.addEventListener("click",function(e){
 if(e.target===AS){AS.hidden=true;return}
 var b=e.target.closest("button");if(!b)return;var t=find(asT);if(!t)return;
 if(b.dataset.asn!==undefined){var ai=edAs.indexOf(b.dataset.asn);if(ai<0)edAs.push(b.dataset.asn);else edAs.splice(ai,1);var on=ai<0;b.setAttribute("aria-pressed",on);b.textContent=(on?"✓ ":"")+pn(t.team||"",b.dataset.asn);return}
 if(b.dataset.st){if(ro()){denied();return}if(!canStage(t)){toast("Only the task creator, assignees or an admin can move this task");return}AS.hidden=true;move(t,b.dataset.st);return}
 if(b.dataset.mt!==undefined&&ROLE==="owner"){AS.hidden=true;t.team=b.dataset.mt;save();render();toast("Moved to "+teamName(t.team));return}
 var a=b.dataset.ac;
 if(a==="x")AS.hidden=true;
 else if(a==="tm"){asMode="time";asDraw()}
 else if(a==="ed"){if(ro()){denied();return}if(!canMod(t)){toast("Only the task creator or an admin can edit this task");return}edInit(t);asMode="edit";asDraw()}
 else if(a==="esave"){if(ro()||!canMod(t)){denied();return}saveEdit(t)}
 else if(a==="test"){audio();beep()}
 else if(a==="tsave"){saveTime(t)}
 else if(a==="cm"){AS.hidden=true;cmOpen(t.id)}
 else if(a==="del"){if(ro()){denied();return}if(!canMod(t)){toast("Only the task creator or an admin can delete this task");return}if(confirm("Delete \""+t.n+"\"?")){AS.hidden=true;delTask(t)}}
});
var swiped=false,sw=null;
V.addEventListener("click",function(e){
 var bv=e.target.closest("button[data-bv]");if(bv){bview=bv.dataset.bv;render();return}
 var tf=e.target.closest("button[data-tf]");if(tf){tsel[tf.dataset.tf]=!tsel[tf.dataset.tf];render();return}
 var tb=e.target.closest("button[data-tbl]");if(tb){tblExport(tb.dataset.tbl==="share");return}
 var tr=e.target.closest("tr[data-id]");if(tr&&!e.target.closest("button")){var th=find(tr.dataset.id);if(th&&th.ty==="daily")asTime(th.id);else asOpen(+tr.dataset.id);return}
 var st=e.target.closest("button[data-stage]");if(st){bcol=st.dataset.stage;render();return}
 var c=e.target.closest(".card");if(!c||e.target.closest("button")||swiped)return;asOpen(+c.dataset.id);
});
V.addEventListener("touchstart",function(e){var c=e.target.closest(".card");if(!c||e.touches.length!==1||ro()||!canStage(find(c.dataset.id)||{})){sw=null;return}var t=e.touches[0];sw={id:c.dataset.id,x:t.clientX,y:t.clientY,c:c}},{passive:true});
V.addEventListener("touchmove",function(e){if(!sw)return;var t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5)sw.c.style.transform="translateX("+Math.max(-90,Math.min(90,dx))+"px)"},{passive:true});
V.addEventListener("touchend",function(e){
 if(!sw)return;var c=sw.c,t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y,id=sw.id;sw=null;c.style.transform="";
 if(Math.abs(dx)<80||Math.abs(dx)<Math.abs(dy)*1.5)return;
 swiped=true;setTimeout(function(){swiped=false},400);
 var tk=find(id);if(!tk)return;
 var k=COLS.map(function(x){return x[0]}),n=k[k.indexOf(tk.st)+(dx>0?1:-1)];if(n)move(tk,n);
});

/* export / import all app data as a JSON file */
function dmsg(t){$("dmsg").textContent=t}
$("exp").onclick=function(){
 var data={app:"study-planner",version:2,exported:new Date().toISOString(),tasks:S.tasks,act:S.act,focus:S.focus,ext:X0};
 var a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
 a.href=u;a.download="study-planner-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(u)},1000);
 dmsg("Exported "+S.tasks.length+" items.");
};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){
 var f=this.files[0];this.value="";if(!f)return;
 var r=new FileReader();
 r.onerror=function(){dmsg("Could not read that file.")};
 r.onload=function(){
  var d;try{d=JSON.parse(r.result)}catch(e){dmsg("That file is not valid JSON.");return}
  if(!d||d.app!=="study-planner"||!Array.isArray(d.tasks)){dmsg("That file is not a Study Planner backup.");return}
  if(ro()||(live&&ROLE!=="owner")){dmsg("Only admins can import into the shared board.");return}
  var tasks=d.tasks.filter(function(t){return t&&typeof t.n==="string"&&isFinite(t.id)}).map(function(t){
   t.id=+t.id;t.log=(t.log&&typeof t.log==="object")?t.log:{};if(t.own)t.own=ME;return t});
  var msg="Replace ALL current data with this file ("+tasks.length+" items)? Anything not in the file will be removed."+(live?" Live sync is on, so this also updates the shared board for everyone.":"");
  if(!confirm(msg))return;
  S.tasks=tasks;S.act=(d.act&&typeof d.act==="object")?d.act:{};S.focus=(d.focus&&typeof d.focus==="object")?d.focus:{};
  X0=(d.ext&&typeof d.ext==="object")?d.ext:{};saveX();
  save();render();dmsg("Imported "+tasks.length+" items.");
 };
 r.readAsText(f);
};
load();loadX();hbase();hbtn();render();start();almCheck();
})();
